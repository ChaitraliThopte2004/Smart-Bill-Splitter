<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <style>
    body{
      margin:0;
      font-family: Arial;
      background:#f4f6ff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:white;
      padding:30px 40px;
      border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      width:320px;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    input{
      width:100%;
      padding:10px;
      margin:8px 0 15px 0;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:14px;
    }

    button{
      width:100%;
      padding:10px;
      border:none;
      border-radius:8px;
      background:#28a745;
      color:white;
      font-size:15px;
      cursor:pointer;
    }

    button:hover{
      background:#1e8a37;
    }

    .link{
      display:block;
      text-align:center;
      margin-top:12px;
      color:#4a67ff;
      text-decoration:none;
    }

    .link:hover{
      text-decoration:underline;
    }
  </style>

</head>

<body>

<div class="card">
  <h2>Create Account</h2>

  <form method="post">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button>Register</button>
  </form>

  <a class="link" href="/login">Already have an account? Login</a>
</div>

</body>
</html>
